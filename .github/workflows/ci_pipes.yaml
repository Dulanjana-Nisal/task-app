name: MERN Application CI

on:
  push:
    branches:
      - main
      - dev/qa
  
  pull_request:
    branches:
      - main
  
jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependency
        run: npm ci

      - name:  Run tests
        run: npm test
  
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
        
      - name: Install dependency
        run: npm ci

      - name: Run test
        run: npm test