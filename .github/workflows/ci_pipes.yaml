name: Sample CI pipeline

on: 
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # step 1: download codebase in to runner
      - name: Checkout repo
        uses: actions/checkout@v4
      
      # step 2: Setup node environment
      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # setup 3: Install dependency
      - name: Install dependency
        run: npm ci

      # step 4: run test files or something
      - name: Execute final result
        run: npm test
  
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # step 1: download code in to runner 
      - name: Checkout code in to environment
        uses: actions/checkout@v4

      # step 2: setup node environment
      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # step 3: Install dependency
      - name: Install dependency
        run: npm ci
      
      # final step: End pipeline
      - name: Final Execute
        run: npm test