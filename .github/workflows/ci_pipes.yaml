name: Application CI

on:
  push:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
        
    steps:
      # Step 1: Download code base in to runner
      - name: Download code base
        uses: actions/checkout@v4

      # step 2: Create node environment
      - name: Create node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      # step 3: Install dependency
      - name: Install dependency
        run: npm ci

      # step 4: Run test
      - name: Run Tests
        run: npm test
  
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download code base
        uses: actions/checkout@v4

      - name: Create node environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency
        run: npm ci

      - name: Run Tests
        run: npm test

  run-docker:
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Docker containerization
        run: echo 'Building Docker image'