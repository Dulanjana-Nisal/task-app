version: '3'
services:
  mongo-db:
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - task-net

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin          
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password   
      - ME_CONFIG_MONGODB_SERVER=mongo-db                    
      - ME_CONFIG_BASICAUTH_USERNAME=dulanjananisal           
      - ME_CONFIG_BASICAUTH_PASSWORD=#D123u45l#
    networks:
      - task-net

  

networks:
  task-net:
    driver: bridge