<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="container">
        <div class="login-form">
            <div class="form-header">
                <h1>Register</h1>
                <p>Please enter your details for Register</p>
            </div>
            <div class="form-body">
                <form action="#" method="post">
                    <div class="name">
                        <label for="name">Name</label><br>
                        <input type="text" placeholder="Enter your name">
                    </div>
                    <div class="email">
                        <label for="name">Email</label><br>
                        <input type="email" placeholder="Enter your Email">
                    </div>
                    <div class="password">
                        <label for="name">Password</label><br>
                        <input type="password" placeholder="Enter your Password">
                        <img src="../images/svgs/close-eye.svg" alt="close-eye" class="close-eye">
                        <img src="../images/svgs/open-eye.svg" alt="open-eye" class="open-eye">
                    </div>
                    <div class="messages">
                        <p>Some Error messages here</p>
                    </div>
                    <div class="btn">
                        <input type="submit" value="Sign in">
                    </div>
                </form>
            </div>
            <div class="form-footer">
                <p>Already have an account <a href="../login/login.html">Sign in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
